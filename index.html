<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Fondasi songwriting Melodi.">
    <title>Melodi</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/app.css">
    <script defer src="./vendor/vexflow/vexflow-bravura.js"></script>
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>Melodi</h1>
        <p data-copy="intro"></p>
      </div>
      <label class="language-control">
        <span data-copy="languageLabel"></span>
        <select id="language" data-action="language-switch" data-focus-key="language">
          <option value="id">Indonesia</option>
          <option value="en">English</option>
        </select>
      </label>
    </header>

    <main>
      <section aria-labelledby="song-heading">
        <h2 id="song-heading" data-copy="songHeading"></h2>
        <p id="song-title" data-entity="song-title"></p>
        <button id="new-idea" type="button" class="secondary" data-action="new-idea" data-copy="newIdeaButton"></button>
        <dl class="song-summary" data-entity="song-summary">
          <div><dt data-copy="tempoLabel"></dt><dd id="tempo-value"></dd></div>
          <div><dt data-copy="keyLabel"></dt><dd id="key-value"></dd></div>
          <div><dt data-copy="timeSignatureLabel"></dt><dd id="time-signature-value"></dd></div>
        </dl>
      </section>

      <section id="view-controls" aria-labelledby="view-heading">
        <h2 id="view-heading" data-copy="viewHeading"></h2>
        <div class="panel editor-view-controls">
          <label>
            <span data-copy="viewModeLabel"></span>
            <select id="view-mode" data-action="set-view-mode" data-entity="workspace-view" data-focus-key="view-mode">
              <option value="score" data-copy="viewScoreOption"></option>
              <option value="piano-roll" data-copy="viewPianoRollOption"></option>
              <option value="combined" data-copy="viewCombinedOption"></option>
              <option value="lyrics" data-copy="viewLyricsOption"></option>
            </select>
          </label>
          <label class="follow-mode-control">
            <input id="follow-mode" type="checkbox" data-action="set-follow-mode" data-entity="follow-mode">
            <span data-copy="followModeLabel"></span>
          </label>
        </div>
      </section>

      <section id="piano-roll-section" data-view-region="piano-roll" aria-labelledby="piano-roll-heading">
        <h2 id="piano-roll-heading" data-copy="pianoRollHeading"></h2>
        <p data-copy="pianoRollHelp"></p>
        <div id="editor-toolbar" class="panel editor-toolbar" aria-label="Piano Roll controls">
          <label>
            <span data-copy="snapLabel"></span>
            <select id="snap-select" data-action="set-snap">
              <option value="1/4">1/4</option>
              <option value="1/8">1/8</option>
              <option value="1/16">1/16</option>
            </select>
          </label>
          <button id="copy-selection" type="button" class="secondary" data-action="copy-selection" data-copy="copyButton"></button>
          <button id="paste-notes" type="button" class="secondary" data-action="paste-notes" data-copy="pasteButton" disabled></button>
          <button id="clear-selection" type="button" class="secondary" data-action="clear-selection" data-copy="clearSelectionButton"></button>
        </div>
        <div id="piano-roll-scroll" class="piano-roll-scroll" role="region" aria-label="Piano Roll grid" tabindex="0">
          <svg id="piano-roll" role="img" aria-label="Piano Roll"></svg>
        </div>
        <p id="roll-selection" class="muted" data-entity="selected-notes"></p>
      </section>

      <section id="score-section" data-view-region="score" aria-labelledby="score-heading">
        <h2 id="score-heading" data-copy="scoreHeading"></h2>
        <p data-copy="scoreHelp"></p>
        <p id="score-status" class="muted" role="status" aria-live="polite" aria-atomic="true" data-entity="score-status"></p>
        <div id="score-scroll" class="score-scroll" role="region" tabindex="0" aria-label="Score">
          <svg id="score"></svg>
        </div>
        <div id="score-fallback" class="score-fallback" hidden></div>
      </section>

      <section aria-labelledby="playback-heading">
        <h2 id="playback-heading" data-copy="playbackHeading"></h2>
        <fieldset class="panel transport-controls" aria-describedby="playback-readout">
          <legend data-copy="playbackHeading"></legend>
          <div class="transport-buttons">
            <button id="play" type="button" data-action="play" data-copy="playButton"></button>
            <button id="pause" type="button" data-action="pause" data-copy="pauseButton" disabled></button>
            <button id="stop" type="button" class="secondary" data-action="stop" data-copy="stopButton"></button>
          </div>

          <dl id="playback-readout" class="playback-readout" aria-live="off">
            <div><dt data-copy="playbackStatusLabel"></dt><dd id="playback-status" data-entity="playback-status"></dd></div>
            <div><dt data-copy="currentTickLabel"></dt><dd><output id="current-tick" data-entity="current-tick">0</output></dd></div>
            <div><dt data-copy="currentNoteLabel"></dt><dd><output id="current-note" data-entity="current-note"></output></dd></div>
            <div><dt data-copy="currentSectionLabel"></dt><dd><output id="current-section" data-entity="current-section"></output></dd></div>
          </dl>

          <form class="transport-form" data-action="seek">
            <label><span data-copy="seekTickLabel"></span><input id="seek-tick" name="tick" type="number" min="0" step="1" value="0" required></label>
            <button type="submit" data-action="seek" data-copy="seekButton"></button>
          </form>

          <form class="transport-form" data-action="set-tempo">
            <label><span data-copy="tempoInputLabel"></span><input id="tempo-input" name="tempo" type="number" min="20" max="300" step="1" value="120" required></label>
            <button type="submit" data-action="set-tempo" data-copy="applyTempoButton"></button>
          </form>

          <form class="transport-form loop-range" data-action="set-loop">
            <label><span data-copy="loopStartLabel"></span><input id="loop-start" name="startTick" type="number" min="0" step="1" value="0" required></label>
            <label><span data-copy="loopEndLabel"></span><input id="loop-end" name="endTick" type="number" min="1" step="1" value="1920" required></label>
            <button type="submit" data-action="set-loop" data-copy="applyLoopButton"></button>
            <label class="loop-toggle"><input id="loop-enabled" type="checkbox" data-action="set-loop-enabled"><span data-copy="loopEnabledLabel"></span></label>
          </form>
        </fieldset>
      </section>

      <section aria-labelledby="notes-heading">
        <h2 id="notes-heading" data-copy="notesHeading"></h2>
        <p data-copy="notesHelp"></p>
        <ol id="note-list" class="note-list" data-entity="note-list"></ol>

        <form id="add-note-form" class="panel" data-action="add-note">
          <h3 data-copy="addNoteHeading"></h3>
          <div class="form-grid">
            <label><span data-copy="pitchLabel"></span><input name="pitch" type="text" value="C4" pattern="[A-Ga-g][#b]?-?[0-9]+" required data-focus-key="add-pitch"></label>
            <label><span data-copy="startTickLabel"></span><input id="add-start-tick" name="startTick" type="number" min="0" step="1" required data-focus-key="add-start"></label>
            <label><span data-copy="durationLabel"></span><input name="durationTicks" type="number" min="1" step="1" value="480" required data-focus-key="add-duration"></label>
          </div>
          <button type="submit" data-focus-key="add-button" data-copy="addNoteButton"></button>
        </form>
      </section>

      <section id="lyrics-section" data-view-region="lyrics" aria-labelledby="lyrics-heading">
        <h2 id="lyrics-heading" data-copy="lyricsHeading"></h2>
        <form id="lyrics-form" class="panel" data-action="set-lyrics">
          <label><span data-copy="rawLyricsLabel"></span><textarea id="raw-lyrics" name="rawText" rows="3" data-focus-key="lyrics"></textarea></label>
          <button type="submit" data-copy="saveLyricsButton"></button>
        </form>
        <p id="syllable-summary" class="muted" data-entity="lyric-mapping"></p>
        <form id="add-syllable-form" class="panel syllable-add-form" data-action="add-syllable">
          <label><span data-copy="newSyllableLabel"></span><input name="text" type="text" data-focus-key="new-syllable"></label>
          <button type="submit" data-copy="addSyllableButton"></button>
        </form>
        <ol id="syllable-list" class="syllable-list" data-entity="lyric-syllable-list"></ol>
      </section>

      <section aria-labelledby="selection-heading">
        <h2 id="selection-heading" data-copy="selectionHeading"></h2>
        <form id="selection-form" class="panel" data-action="select-range">
          <div class="form-grid">
            <label><span data-copy="rangeStartLabel"></span><input name="startTick" type="number" min="0" step="1" value="0" required data-focus-key="range-start"></label>
            <label><span data-copy="rangeEndLabel"></span><input name="endTick" type="number" min="0" step="1" value="1920" required data-focus-key="range-end"></label>
          </div>
          <button type="submit" data-copy="selectRangeButton"></button>
        </form>
        <p id="selection-summary" class="muted" data-entity="selection"></p>
      </section>

      <p id="operation-status" class="status" role="status" aria-live="polite" aria-atomic="true" data-entity="operation-status"></p>
    </main>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Fondasi songwriting Melodi.">
    <meta name="melodi-build" content="20260930.25">
    <title>Melodi</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/app.css?v=20260930.25">
    <script defer src="./vendor/abcjs/abcjs-basic-min.js?v=20260930.25"></script>
    <script type="module" src="./src/app.js?v=20260930.25"></script>
  </head>
  <body>
    <header class="page-header">
      <div class="brand-block">
        <h1>Melodi</h1>
        <p data-copy="intro"></p>
      </div>
      <div class="header-actions">
        <details id="project-menu" class="project-menu" data-aria-copy="projectMenuLabel">
          <summary class="secondary project-menu-trigger">
            <svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M3 4.5h5l1.5 2H17v9H3z"></path><path d="M3.5 8h13"></path></svg>
            <span data-copy="projectMenuLabel"></span>
          </summary>
          <div class="project-menu-popover" role="group" data-aria-copy="projectMenuLabel">
            <button type="button" data-action="new-song" data-copy="newSongMenuItem"></button>
            <button type="button" data-action="show-examples" data-copy="examplesMenuItem"></button>
            <button type="button" data-action="show-browser-library" data-copy="openBrowserMenuItem"></button>
            <button type="button" data-action="show-save-browser" data-copy="saveBrowserMenuItem"></button>
            <hr>
            <button id="open-project-file" type="button" data-action="open-project-file" data-copy="openFileButton"></button>
            <button id="save-project-file" type="button" data-action="save-project-file" data-copy="saveFileButton"></button>
            <button id="share-song" type="button" data-action="share-song" data-copy="shareButton"></button>
          </div>
        </details>
        <input id="project-file-input" type="file" accept=".melodi.json,application/json" hidden>
        <div class="header-controls" role="group" data-aria-copy="appearanceLanguageGroupLabel">
          <button type="button" class="command-button secondary icon-button" data-action="command-palette" data-aria-copy="paletteOpenLabel" data-focus-key="command-palette" aria-keyshortcuts="Control+K Meta+K">
            <svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5"></rect><path d="M5 7h1M9.5 7h1M14 7h1M5 10h1M9.5 10h1M14 10h1M6 13.5h8"></path></svg>
          </button>
          <label class="header-select-control">
            <svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="7.2"></circle><path d="M2.9 10h14.2M10 2.8c2 2 3 4.4 3 7.2s-1 5.2-3 7.2c-2-2-3-4.4-3-7.2s1-5.2 3-7.2Z"></path></svg>
            <span class="visually-hidden" data-copy="languageLabel"></span>
            <select id="language" data-action="language-switch" data-focus-key="language" data-aria-copy="languageLabel">
              <option value="id">Indonesia</option>
              <option value="en">English</option>
            </select>
          </label>
          <label class="header-select-control">
            <svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M16.8 12.1A7 7 0 0 1 7.9 3.2 7.5 7.5 0 1 0 16.8 12.1Z"></path><path d="M13.7 2.5v3.2M12.1 4.1h3.2"></path></svg>
            <span class="visually-hidden" data-copy="themeLabel"></span>
            <select id="theme" data-action="theme-switch" data-entity="theme" data-focus-key="theme" data-aria-copy="themeLabel">
              <option value="system" data-copy="themeSystem"></option>
              <option value="light" data-copy="themeLight"></option>
              <option value="dark" data-copy="themeDark"></option>
            </select>
          </label>
        </div>
      </div>
    </header>

    <main class="app-shell">
      <section class="song-strip" aria-labelledby="song-heading">
        <div class="song-identity">
          <h2 id="song-heading" class="eyebrow" data-copy="songHeading"></h2>
          <p id="song-title" data-entity="song-title"></p>
        </div>
        <dl class="song-summary" data-entity="song-summary">
          <div><dt data-copy="tempoLabel"></dt><dd id="tempo-value"></dd></div>
          <div><dt data-copy="keyLabel"></dt><dd id="key-value"></dd></div>
          <div><dt data-copy="timeSignatureLabel"></dt><dd id="time-signature-value"></dd></div>
        </dl>
        <div class="share-session-actions">
          <span id="shared-source" class="shared-source" data-copy="sharedSourceLabel" hidden></span>
        </div>
      </section>

      <div class="workspace-chrome">
      <section class="transport-dock" aria-labelledby="playback-heading">
        <h2 id="playback-heading" class="visually-hidden" data-copy="playbackHeading"></h2>
        <div class="transport-main">
          <div class="transport-action-group" role="group" data-aria-copy="transportControlsGroupLabel">
            <div class="transport-buttons">
              <button id="play" type="button" data-action="play" data-aria-copy="playButton"><svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5.5 3.5 16 10 5.5 16.5z" fill="currentColor" stroke="none"></path></svg></button>
              <button id="pause" type="button" data-action="pause" data-aria-copy="pauseButton" disabled><svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M6 4v12M14 4v12" stroke-width="3"></path></svg></button>
              <button id="stop" type="button" class="secondary" data-action="stop" data-aria-copy="stopButton"><svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="5" y="5" width="10" height="10" rx="1" fill="currentColor" stroke="none"></rect></svg></button>
            </div>

            <div class="history-buttons" role="group" data-aria-copy="editHistoryLabel">
              <button id="undo" type="button" class="secondary" data-action="undo" data-aria-copy="undoLabel" data-focus-key="undo" disabled><svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M7 6 3 9l4 3M3.5 9H11a5 5 0 0 1 5 5"></path></svg></button>
              <button id="redo" type="button" class="secondary" data-action="redo" data-aria-copy="redoLabel" data-focus-key="redo" disabled><svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m13 6 4 3-4 3M16.5 9H9a5 5 0 0 0-5 5"></path></svg></button>
            </div>

            <dl id="playback-readout" class="playback-readout" aria-live="off">
              <div><dt data-copy="playbackStatusLabel"></dt><dd id="playback-status" data-entity="playback-status"></dd></div>
              <div class="machine-detail"><dt data-copy="currentTickLabel"></dt><dd><output id="current-tick" data-entity="current-tick">0</output></dd></div>
              <div><dt data-copy="currentNoteLabel"></dt><dd><output id="current-note" data-entity="current-note"></output></dd></div>
              <div class="machine-detail"><dt data-copy="currentSectionLabel"></dt><dd><output id="current-section" data-entity="current-section"></output></dd></div>
            </dl>
          </div>

          <div class="playback-settings-group" role="group" data-aria-copy="playbackSettingsGroupLabel">
            <form class="transport-form tempo-control" data-action="set-tempo">
              <label><span data-copy="tempoInputLabel"></span><input id="tempo-input" name="tempo" type="number" min="20" max="300" step="1" value="120" required data-action="set-tempo-direct"></label>
              <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true" data-action="set-tempo" data-copy="applyTempoButton"></button>
            </form>

            <label class="loop-toggle"><input id="loop-enabled" type="checkbox" data-action="set-loop-enabled"><span data-copy="loopEnabledLabel"></span></label>
            <button id="reset-playback-range" type="button" class="secondary range-reset" data-action="reset-loop-range" data-copy="allTimelineButton" data-aria-copy="allTimelineAria" hidden></button>

            <details class="transport-advanced">
              <summary class="disclosure-summary" data-aria-copy="transportAdvanced"><svg class="toolbar-icon disclosure-chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4 7 6 6 6-6"></path></svg><span data-copy="transportAdvanced"></span></summary>
              <div class="transport-advanced-grid">
                <form class="transport-form" data-action="seek">
                  <label><span data-copy="seekTickLabel"></span><input id="seek-tick" name="tick" type="number" min="0" step="1" value="0" required></label>
                  <button type="submit" data-action="seek" data-copy="seekButton"></button>
                </form>
                <form class="transport-form loop-range" data-action="set-loop">
                  <label><span data-copy="loopStartLabel"></span><input id="loop-start" name="startTick" type="number" min="0" step="1" value="0" required></label>
                  <label><span data-copy="loopEndLabel"></span><input id="loop-end" name="endTick" type="number" min="1" step="1" value="1920" required></label>
                  <button type="submit" data-action="set-loop" data-copy="applyLoopButton"></button>
                </form>
              </div>
            </details>

            <label class="follow-mode-control">
              <input id="follow-mode" type="checkbox" data-action="set-follow-mode" data-entity="follow-mode">
              <span data-copy="followModeLabel"></span>
            </label>
          </div>
        </div>
      </section>

      <section id="view-controls" class="workspace-toolbar" aria-labelledby="view-heading">
        <h2 id="view-heading" class="visually-hidden" data-copy="viewHeading"></h2>
        <div class="editor-view-controls" role="group" data-aria-copy="viewControlGroupLabel">
          <label class="compact-field">
            <svg class="toolbar-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="2.5" y="3" width="6.5" height="5.5" rx=".7"></rect><rect x="11" y="3" width="6.5" height="5.5" rx=".7"></rect><rect x="2.5" y="10.5" width="15" height="6.5" rx=".7"></rect></svg>
            <span class="visually-hidden" data-copy="viewModeLabel"></span>
            <select id="view-mode" data-action="set-view-mode" data-entity="workspace-view" data-focus-key="view-mode" data-aria-copy="viewModeLabel">
              <option value="score" data-copy="viewScoreOption"></option>
              <option value="piano-roll" data-copy="viewPianoRollOption"></option>
              <option value="combined" data-copy="viewCombinedOption"></option>
              <option value="lyrics" data-copy="viewLyricsOption"></option>
              <option value="guitar" data-copy="viewGuitarOption"></option>
              <option value="drums" data-copy="viewDrumsOption"></option>
            </select>
          </label>
        </div>
      </section>

      </div>

      <div class="workspace-grid">
        <div class="workspace-canvas">
          <section id="piano-roll-section" class="workspace-pane" data-view-region="piano-roll" aria-labelledby="piano-roll-heading">
            <div class="pane-heading compact-pane-heading">
              <div class="pane-title-row">
                <h2 id="piano-roll-heading" data-copy="pianoRollHeading"></h2>
                <p id="piano-roll-collapse-summary" class="collapsed-panel-summary" hidden></p>
                <details class="pane-help">
                  <summary data-aria-copy="pianoRollHelpButton">?</summary>
                  <div class="pane-help-popover">
                    <p data-copy="pianoRollHelp"></p>
                  </div>
                </details>
              </div>
              <div id="editor-toolbar" class="editor-toolbar" aria-label="Piano Roll controls">
                <div class="editor-toolbar-group editor-tool-group" role="group" data-aria-copy="toolGroupLabel">
                  <span class="editor-toolbar-label" data-copy="toolGroupLabel"></span>
                  <button id="roll-tool-select" type="button" data-action="set-tool" data-tool="select" data-copy="toolSelectButton" data-aria-copy="toolSelectAria" aria-pressed="true"></button>
                  <button id="roll-tool-draw" type="button" data-action="set-tool" data-tool="draw" data-copy="toolDrawButton" data-aria-copy="toolDrawAria" aria-pressed="false"></button>
                </div>
                <div class="editor-meter" data-entity="time-signature">
                  <span data-copy="meterLabel"></span>
                  <output id="editor-meter">4/4</output>
                </div>
                <label>
                  <span data-copy="snapLabel"></span>
                  <select id="snap-select" data-action="set-snap">
                    <option value="1/4">1/4</option>
                    <option value="1/8">1/8</option>
                    <option value="1/16">1/16</option>
                  </select>
                </label>
                <label class="zoom-control">
                  <span data-copy="zoomLabel"></span>
                  <input id="roll-zoom" type="range" min="0.5" max="4" step="0.25" value="1" data-action="set-zoom" data-focus-key="roll-zoom" data-aria-copy="zoomSliderLabel">
                  <output id="roll-zoom-value" data-entity="roll-zoom">100%</output>
                </label>

                <button id="copy-selection" type="button" class="secondary" data-action="copy-selection" data-copy="copyButton"></button>
                <button id="paste-notes" type="button" class="secondary" data-action="paste-notes" data-copy="pasteButton" disabled></button>
                <button id="clear-selection" type="button" class="secondary" data-action="clear-selection" data-copy="clearSelectionButton"></button>
              </div>
              <button id="piano-roll-collapse" type="button" class="panel-collapse-button" data-action="toggle-panel" data-panel-collapse="pianoRoll" aria-controls="piano-roll-content" aria-expanded="true">
                <svg class="toolbar-icon disclosure-chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4 7 6 6 6-6"></path></svg>
              </button>
            </div>
            <div id="piano-roll-content" class="panel-disclosure-content">
              <div class="instrument-mix-strip" role="group" data-aria-copy="mixMelodyGroupLabel">
                <strong data-copy="melodyInstrumentLabel"></strong>
                <button type="button" class="instrument-mix-button" data-focus-key="mix:melody:mute" data-action="toggle-instrument-mute" data-channel-id="melody" data-mix-flag="mute" data-copy="mixMuteShort" data-aria-copy="mixMuteMelodyAria" aria-pressed="false"></button>
                <button type="button" class="instrument-mix-button" data-focus-key="mix:melody:solo" data-action="toggle-instrument-solo" data-channel-id="melody" data-mix-flag="solo" data-copy="mixSoloShort" data-aria-copy="mixSoloMelodyAria" aria-pressed="false"></button>
                <input type="range" class="instrument-volume" data-focus-key="mix:melody:volume" data-channel-id="melody" data-channel-volume data-volume-piece="Melody" min="0" max="100" step="1" value="100" aria-label="Volume Melody, 100%">
              </div>
              <div class="roll-surface">
                <div id="piano-roll-scroll" class="piano-roll-scroll" role="region" aria-label="Piano Roll grid" tabindex="0">
                  <svg id="piano-roll" role="img" aria-label="Piano Roll"></svg>
                </div>
                <div id="piano-roll-empty" class="roll-empty" data-entity="roll-empty" hidden>
                  <p class="roll-empty-title" data-copy="emptyRollTitle"></p>
                  <p class="roll-empty-hint" data-copy="emptyRollHint"></p>
                  <p class="roll-empty-hint" data-copy="emptyRollSeedHint"></p>
                </div>
              </div>
              <p id="roll-selection" class="muted selection-readout" data-entity="selected-notes"></p>
            </div>
          </section>

          <section id="score-section" class="workspace-pane score-pane" data-view-region="score" data-score-layout="flow" aria-labelledby="score-heading">
            <div class="pane-heading compact-pane-heading score-pane-heading">
              <div class="score-heading-copy">
                <div class="pane-title-row">
                  <h2 id="score-heading" data-copy="scoreHeading"></h2>
                  <p id="score-selection-summary" class="collapsed-panel-summary"></p>
                </div>
                <p class="score-help" data-copy="scoreHelp"></p>
              </div>
              <div class="score-local-toolbar">
                <div class="score-layout-group" role="group" data-aria-copy="scoreLayoutGroupLabel">
                  <button id="score-layout-flow" type="button" data-action="set-score-layout" data-score-layout="flow" data-copy="scoreFlowButton" data-aria-copy="scoreFlowAria" aria-pressed="true"></button>
                  <button id="score-layout-page" type="button" data-action="set-score-layout" data-score-layout="page" data-copy="scorePageButton" data-aria-copy="scorePageAria" aria-pressed="false"></button>
                </div>
                <p id="score-status" class="muted" role="status" aria-live="polite" aria-atomic="true" data-entity="score-status"></p>
              </div>
            </div>
            <div id="score-scroll" class="score-scroll" role="region" tabindex="0" data-aria-copy="scoreRegionLabel">
              <div id="score-sticky-context" class="score-sticky-context" aria-hidden="true">
                <span class="score-context-clef">𝄞</span>
                <span id="score-context-key"></span>
                <span id="score-context-meter"></span>
              </div>
              <div id="score" data-renderer="abcjs" data-layout="flow"></div>
            </div>
            <div id="score-fallback" class="score-fallback" hidden></div>
          </section>

            <section id="expression-panel" class="workspace-pane expression-panel" data-view-region="expression" aria-labelledby="expression-heading">
              <div class="expression-panel-heading">
                <div class="expression-heading-copy">
                  <h3 id="expression-heading" data-copy="expressionHeading"></h3>
                  <p id="expression-status" class="muted expression-status" data-entity="expression-status"></p>
                  <p id="expression-collapse-summary" class="collapsed-panel-summary" hidden></p>
                </div>
                <button id="expression-collapse" type="button" class="panel-collapse-button" data-action="toggle-panel" data-panel-collapse="expression" aria-controls="expression-content" aria-expanded="true">
                  <svg class="toolbar-icon disclosure-chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4 7 6 6 6-6"></path></svg>
                </button>
              </div>
              <div id="expression-content" class="panel-disclosure-content">
                <div class="expression-toolbar">
                <div class="expression-actions">
                  <div class="expression-mode-group" role="group" data-aria-copy="expressionModeGroupLabel">
                    <button type="button" data-action="set-expression-mode" data-expression-mode="bend" data-copy="expressionBendButton" aria-pressed="true"></button>
                    <button type="button" data-action="set-expression-mode" data-expression-mode="volume" data-copy="expressionVolumeButton" aria-pressed="false"></button>
                    <button type="button" data-action="set-expression-mode" data-expression-mode="pan" data-copy="expressionPanButton" aria-pressed="false"></button>
                    <button type="button" data-action="set-expression-mode" data-expression-mode="vibrato" data-copy="expressionVibratoButton" aria-pressed="false"></button>
                  </div>
                  <button id="expression-edit-bend" type="button" class="secondary" data-action="expression-edit-bend" data-copy="expressionEditBendButton"></button>
                  <button id="expression-reset-selected" type="button" class="secondary" data-action="expression-reset-selected" data-copy="expressionResetButton"></button>
                </div>
              </div>
              <div id="expression-scroll" class="expression-scroll" role="region" tabindex="0" data-aria-copy="expressionRegionLabel">
                <svg id="expression-lane" role="img" data-aria-copy="expressionLaneLabel"></svg>
              </div>

              <div id="expression-bend-tools" class="expression-context-tools" hidden>
                <div class="editor-toolbar-group bend-tool-group" role="group" data-aria-copy="bendGroupLabel">
                  <span class="editor-toolbar-label" data-copy="bendGroupLabel"></span>
                  <button type="button" data-action="set-selected-bend" data-bend="half" data-copy="bendHalfButton" data-focus-key="bend-half" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="half-release" data-copy="bendHalfReleaseButton" data-focus-key="bend-half-release" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="whole" data-copy="bendWholeButton" data-focus-key="bend-whole" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="whole-release" data-copy="bendReleaseButton" data-focus-key="bend-release" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="clear" data-copy="bendClearButton" data-focus-key="bend-clear" disabled></button>
                </div>
                <details id="bend-editor-details" class="bend-curve-editor">
                  <summary class="disclosure-summary"><svg class="toolbar-icon disclosure-chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4 7 6 6 6-6"></path></svg><span data-copy="bendCurveSummary"></span></summary>
                  <div class="bend-curve-body">
                    <div class="bend-curve-head">
                      <label>
                        <span data-copy="bendRangeLabel"></span>
                        <select id="bend-range" data-focus-key="bend-range">
                          <option value="1">±½</option>
                          <option value="2" selected>±1</option>
                          <option value="3">±1½</option>
                          <option value="4">±2</option>
                        </select>
                      </label>
                      <span id="bend-curve-state" class="muted" data-entity="bend-curve-state"></span>
                    </div>
                    <svg id="bend-curve-preview" class="bend-curve-preview" viewBox="0 0 320 120" role="img" data-aria-copy="bendCurvePreviewLabel"></svg>
                    <div id="bend-point-list" class="bend-point-list" data-entity="bend-point-list"></div>
                    <div class="bend-curve-actions">
                      <button type="button" class="secondary" data-action="bend-add-point" data-copy="bendAddPointButton"></button>
                      <button type="button" class="secondary" data-action="bend-reset-curve" data-copy="bendResetCurveButton"></button>
                      <button type="button" data-action="bend-apply-curve" data-copy="bendApplyCurveButton"></button>
                    </div>
                    <p class="muted bend-curve-help" data-copy="bendCurveHelp"></p>
                  </div>
                </details>
              </div>

              <div id="expression-vibrato-tools" class="expression-context-tools" hidden>
                <div class="editor-toolbar-group vibrato-tool-group" role="group" data-aria-copy="vibratoGroupLabel">
                  <span class="editor-toolbar-label" data-copy="vibratoGroupLabel"></span>
                  <button type="button" data-action="set-selected-vibrato" data-vibrato="subtle" data-copy="vibratoSubtleButton" data-focus-key="vibrato-subtle" disabled></button>
                  <button type="button" data-action="set-selected-vibrato" data-vibrato="vocal" data-copy="vibratoVocalButton" data-focus-key="vibrato-vocal" disabled></button>
                  <button type="button" data-action="set-selected-vibrato" data-vibrato="wide" data-copy="vibratoWideButton" data-focus-key="vibrato-wide" disabled></button>
                  <button type="button" data-action="set-selected-vibrato" data-vibrato="clear" data-copy="vibratoClearButton" data-focus-key="vibrato-clear" disabled></button>
                </div>
                <details id="expression-vibrato-details" class="expression-vibrato-details">
                  <summary class="disclosure-summary"><svg class="toolbar-icon disclosure-chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4 7 6 6 6-6"></path></svg><span data-copy="expressionVibratoDetailsSummary"></span></summary>
                  <div class="expression-vibrato-fields">
                    <label><span data-copy="noteVibratoDepthLabel"></span><input id="expression-vibrato-depth" type="number" min="0" max="2" step="0.05"></label>
                    <label><span data-copy="noteVibratoRateLabel"></span><input id="expression-vibrato-rate" type="number" min="0.5" max="12" step="0.1"></label>
                    <label><span data-copy="noteVibratoDelayLabel"></span><input id="expression-vibrato-delay" type="number" min="0" max="100" step="1"></label>
                    <button type="button" data-action="expression-apply-vibrato" data-copy="expressionApplyVibratoButton"></button>
                  </div>
                </details>
              </div>

              <details id="expression-note-details" class="expression-note-details" hidden>
                <summary class="disclosure-summary"><svg class="toolbar-icon disclosure-chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4 7 6 6 6-6"></path></svg><span id="expression-note-summary" data-copy="expressionNoteDetailsSummary"></span></summary>
                <div class="expression-note-tools">

            <input id="browser-song-title" name="title" type="text" maxlength="120" required autocomplete="off" data-focus-key="browser-song-title">
          </label>
          <p id="save-browser-status" class="muted project-dialog-status" aria-live="polite"></p>
          <div class="confirm-dialog-actions">
            <button type="button" class="secondary" data-action="close-project-dialog" data-dialog="save-browser-dialog" data-copy="cancelButton"></button>
            <button type="submit" data-copy="saveBrowserButton"></button>
          </div>
        </form>
      </dialog>

      <dialog id="browser-library-dialog" class="confirm-dialog project-dialog" aria-labelledby="browser-library-dialog-title">
        <div class="confirm-dialog-card">
          <div class="confirm-dialog-copy">
            <h2 id="browser-library-dialog-title" data-copy="browserLibraryDialogTitle"></h2>
            <p data-copy="browserLibraryDialogHelp"></p>
          </div>
          <ol id="browser-library-list" class="project-record-list" data-entity="browser-song-list"></ol>
          <p id="browser-library-status" class="muted project-dialog-status" aria-live="polite"></p>
          <div class="confirm-dialog-actions">
            <button type="button" class="secondary" data-action="close-project-dialog" data-dialog="browser-library-dialog" data-copy="closeButton"></button>
          </div>
        </div>
      </dialog>

      <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
        <form method="dialog" class="confirm-dialog-card">
          <div class="confirm-dialog-copy">
            <h2 id="confirm-dialog-title" data-copy="newIdeaDialogTitle"></h2>
            <p id="confirm-dialog-message" data-copy="confirmNewIdea"></p>
          </div>
          <div class="confirm-dialog-actions">
            <button id="confirm-dialog-cancel" type="submit" value="cancel" class="secondary" data-copy="cancelButton" autofocus></button>
            <button id="confirm-dialog-confirm" type="submit" value="confirm" class="danger-button" data-copy="confirmNewIdeaButton"></button>
          </div>
        </form>
      </dialog>

      <dialog id="command-palette" class="command-palette" data-action="command-palette" aria-labelledby="command-palette-heading">
        <h2 id="command-palette-heading" class="visually-hidden" data-copy="paletteHeading"></h2>
        <div class="palette-search">
          <label class="visually-hidden" for="command-palette-input" data-copy="paletteSearchLabel"></label>
          <input id="command-palette-input" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="command-palette-list" aria-autocomplete="list" data-entity="palette-input" data-focus-key="palette-input">
        </div>
        <ol id="command-palette-list" class="palette-list" role="listbox" data-entity="palette-list"></ol>
        <p id="command-palette-empty" class="palette-empty" data-copy="paletteNoMatch" hidden></p>
        <p class="palette-hint muted" data-copy="paletteHint"></p>
      </dialog>

      <p id="operation-status" class="status" role="status" aria-live="polite" aria-atomic="true" data-entity="operation-status"></p>
    </main>
  </body>
</html>

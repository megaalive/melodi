<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Fondasi songwriting Melodi.">
    <title>Melodi</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/app.css">
    <script defer src="./vendor/vexflow/vexflow-bravura.js"></script>
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <header class="page-header">
      <div class="brand-block">
        <h1>Melodi</h1>
        <p data-copy="intro"></p>
      </div>
      <div class="header-controls">
        <button type="button" class="command-button" data-action="command-palette" data-aria-copy="paletteOpenLabel" data-focus-key="command-palette" aria-keyshortcuts="Control+K Meta+K">
          <span aria-hidden="true">⌘</span>
        </button>
        <label class="language-control">
          <span data-copy="languageLabel"></span>
          <select id="language" data-action="language-switch" data-focus-key="language">
            <option value="id">Indonesia</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="language-control">
          <span data-copy="themeLabel"></span>
          <select id="theme" data-action="theme-switch" data-entity="theme" data-focus-key="theme">
            <option value="system" data-copy="themeSystem"></option>
            <option value="light" data-copy="themeLight"></option>
            <option value="dark" data-copy="themeDark"></option>
          </select>
        </label>
      </div>
    </header>

    <main class="app-shell">
      <section class="song-strip" aria-labelledby="song-heading">
        <div class="song-identity">
          <h2 id="song-heading" class="eyebrow" data-copy="songHeading"></h2>
          <p id="song-title" data-entity="song-title"></p>
        </div>
        <dl class="song-summary" data-entity="song-summary">
          <div><dt data-copy="tempoLabel"></dt><dd id="tempo-value"></dd></div>
          <div><dt data-copy="keyLabel"></dt><dd id="key-value"></dd></div>
          <div><dt data-copy="timeSignatureLabel"></dt><dd id="time-signature-value"></dd></div>
        </dl>
        <button id="new-idea" type="button" class="secondary" data-action="new-idea" data-copy="newIdeaButton"></button>
      </section>

      <div class="workspace-chrome">
      <section class="transport-dock" aria-labelledby="playback-heading">
        <h2 id="playback-heading" class="visually-hidden" data-copy="playbackHeading"></h2>
        <div class="transport-main">
          <div class="transport-buttons" aria-label="Playback">
            <button id="play" type="button" data-action="play" data-aria-copy="playButton">▶</button>
            <button id="pause" type="button" data-action="pause" data-aria-copy="pauseButton" disabled>❚❚</button>
            <button id="stop" type="button" class="secondary" data-action="stop" data-aria-copy="stopButton">■</button>
          </div>

          <div class="history-buttons" role="group" data-aria-copy="editHistoryLabel">
            <button id="undo" type="button" class="secondary" data-action="undo" data-aria-copy="undoLabel" data-focus-key="undo" disabled>↶</button>
            <button id="redo" type="button" class="secondary" data-action="redo" data-aria-copy="redoLabel" data-focus-key="redo" disabled>↷</button>
          </div>

          <dl id="playback-readout" class="playback-readout" aria-live="off">
            <div><dt data-copy="playbackStatusLabel"></dt><dd id="playback-status" data-entity="playback-status"></dd></div>
            <div class="machine-detail"><dt data-copy="currentTickLabel"></dt><dd><output id="current-tick" data-entity="current-tick">0</output></dd></div>
            <div><dt data-copy="currentNoteLabel"></dt><dd><output id="current-note" data-entity="current-note"></output></dd></div>
            <div class="machine-detail"><dt data-copy="currentSectionLabel"></dt><dd><output id="current-section" data-entity="current-section"></output></dd></div>
          </dl>

          <form class="transport-form tempo-control" data-action="set-tempo">
            <label><span data-copy="tempoInputLabel"></span><input id="tempo-input" name="tempo" type="number" min="20" max="300" step="1" value="120" required data-action="set-tempo-direct"></label>
            <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true" data-action="set-tempo" data-copy="applyTempoButton"></button>
          </form>

          <label class="loop-toggle"><input id="loop-enabled" type="checkbox" data-action="set-loop-enabled"><span data-copy="loopEnabledLabel"></span></label>

          <details class="transport-advanced">
            <summary data-copy="transportAdvanced"></summary>
            <div class="transport-advanced-grid">
              <form class="transport-form" data-action="seek">
                <label><span data-copy="seekTickLabel"></span><input id="seek-tick" name="tick" type="number" min="0" step="1" value="0" required></label>
                <button type="submit" data-action="seek" data-copy="seekButton"></button>
              </form>
              <form class="transport-form loop-range" data-action="set-loop">
                <label><span data-copy="loopStartLabel"></span><input id="loop-start" name="startTick" type="number" min="0" step="1" value="0" required></label>
                <label><span data-copy="loopEndLabel"></span><input id="loop-end" name="endTick" type="number" min="1" step="1" value="1920" required></label>
                <button type="submit" data-action="set-loop" data-copy="applyLoopButton"></button>
              </form>
            </div>
          </details>
        </div>
      </section>

      <section id="view-controls" class="workspace-toolbar" aria-labelledby="view-heading">
        <h2 id="view-heading" class="visually-hidden" data-copy="viewHeading"></h2>
        <div class="editor-view-controls">
          <label class="compact-field">
            <span data-copy="viewModeLabel"></span>
            <select id="view-mode" data-action="set-view-mode" data-entity="workspace-view" data-focus-key="view-mode">
              <option value="score" data-copy="viewScoreOption"></option>
              <option value="piano-roll" data-copy="viewPianoRollOption"></option>
              <option value="combined" data-copy="viewCombinedOption"></option>
              <option value="lyrics" data-copy="viewLyricsOption"></option>
              <option value="guitar" data-copy="viewGuitarOption"></option>
            </select>
          </label>
          <label class="follow-mode-control">
            <input id="follow-mode" type="checkbox" data-action="set-follow-mode" data-entity="follow-mode">
            <span data-copy="followModeLabel"></span>
          </label>
        </div>
      </section>

      </div>

      <div class="workspace-grid">
        <div class="workspace-canvas">
          <section id="piano-roll-section" class="workspace-pane" data-view-region="piano-roll" aria-labelledby="piano-roll-heading">
            <div class="pane-heading">
              <div>
                <h2 id="piano-roll-heading" data-copy="pianoRollHeading"></h2>
                <p data-copy="pianoRollHelp"></p>
              </div>
              <div id="editor-toolbar" class="editor-toolbar" aria-label="Piano Roll controls">
                <div class="editor-toolbar-group editor-tool-group" role="group" data-aria-copy="toolGroupLabel">
                  <span class="editor-toolbar-label" data-copy="toolGroupLabel"></span>
                  <button id="roll-tool-select" type="button" data-action="set-tool" data-tool="select" data-copy="toolSelectButton" data-aria-copy="toolSelectAria" aria-pressed="true"></button>
                  <button id="roll-tool-draw" type="button" data-action="set-tool" data-tool="draw" data-copy="toolDrawButton" data-aria-copy="toolDrawAria" aria-pressed="false"></button>
                </div>
                <div class="editor-meter" data-entity="time-signature">
                  <span data-copy="meterLabel"></span>
                  <output id="editor-meter">4/4</output>
                </div>
                <label>
                  <span data-copy="snapLabel"></span>
                  <select id="snap-select" data-action="set-snap">
                    <option value="1/4">1/4</option>
                    <option value="1/8">1/8</option>
                    <option value="1/16">1/16</option>
                  </select>
                </label>
                <label class="zoom-control">
                  <span data-copy="zoomLabel"></span>
                  <input id="roll-zoom" type="range" min="0.5" max="4" step="0.25" value="1" data-action="set-zoom" data-focus-key="roll-zoom" data-aria-copy="zoomSliderLabel">
                  <output id="roll-zoom-value" data-entity="roll-zoom">100%</output>
                </label>
                <div class="editor-toolbar-group" role="group" data-aria-copy="transposeGroupLabel">
                  <span class="editor-toolbar-label" data-copy="transposeGroupLabel"></span>
                  <button type="button" data-action="transpose-selected" data-delta="-12" data-aria-copy="transposeDownOctave" data-focus-key="transpose-down-12" disabled>−12</button>
                  <button type="button" data-action="transpose-selected" data-delta="-1" data-aria-copy="transposeDownSemitone" data-focus-key="transpose-down-1" disabled>−1</button>
                  <button type="button" data-action="transpose-selected" data-delta="1" data-aria-copy="transposeUpSemitone" data-focus-key="transpose-up-1" disabled>+1</button>
                  <button type="button" data-action="transpose-selected" data-delta="12" data-aria-copy="transposeUpOctave" data-focus-key="transpose-up-12" disabled>+12</button>
                </div>
                <div class="editor-toolbar-group" role="group" data-aria-copy="durationGroupLabel">
                  <span class="editor-toolbar-label" data-copy="durationGroupLabel"></span>
                  <button type="button" data-action="set-selected-duration" data-snap="1/8" data-focus-key="duration-1-8" disabled>1/8</button>
                  <button type="button" data-action="set-selected-duration" data-snap="1/4" data-focus-key="duration-1-4" disabled>1/4</button>
                  <button type="button" data-action="set-selected-duration" data-snap="1/2" data-focus-key="duration-1-2" disabled>1/2</button>
                </div>
                <div class="editor-toolbar-group bend-tool-group" role="group" data-aria-copy="bendGroupLabel">
                  <span class="editor-toolbar-label" data-copy="bendGroupLabel"></span>
                  <button type="button" data-action="set-selected-bend" data-bend="half" data-copy="bendHalfButton" data-focus-key="bend-half" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="whole" data-copy="bendWholeButton" data-focus-key="bend-whole" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="whole-release" data-copy="bendReleaseButton" data-focus-key="bend-release" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="clear" data-copy="bendClearButton" data-focus-key="bend-clear" disabled></button>
                </div>
                <button id="copy-selection" type="button" class="secondary" data-action="copy-selection" data-copy="copyButton"></button>
                <button id="paste-notes" type="button" class="secondary" data-action="paste-notes" data-copy="pasteButton" disabled></button>
                <button id="clear-selection" type="button" class="secondary" data-action="clear-selection" data-copy="clearSelectionButton"></button>
              </div>
            </div>
            <div class="roll-surface">
              <div id="piano-roll-scroll" class="piano-roll-scroll" role="region" aria-label="Piano Roll grid" tabindex="0">
                <svg id="piano-roll" role="img" aria-label="Piano Roll"></svg>
              </div>
              <div id="piano-roll-empty" class="roll-empty" data-entity="roll-empty" hidden>
                <p class="roll-empty-title" data-copy="emptyRollTitle"></p>
                <p class="roll-empty-hint" data-copy="emptyRollHint"></p>
                <p class="roll-empty-hint" data-copy="emptyRollSeedHint"></p>
              </div>
            </div>
            <p id="roll-selection" class="muted selection-readout" data-entity="selected-notes"></p>
          </section>

          <section id="score-section" class="workspace-pane" data-view-region="score" aria-labelledby="score-heading">
            <div class="pane-heading">
              <div>
                <h2 id="score-heading" data-copy="scoreHeading"></h2>
                <p data-copy="scoreHelp"></p>
              </div>
              <div class="score-heading-tools">
                <div class="editor-toolbar-group bend-tool-group" role="group" data-aria-copy="bendGroupLabel">
                  <span class="editor-toolbar-label" data-copy="bendGroupLabel"></span>
                  <button type="button" data-action="set-selected-bend" data-bend="half" data-copy="bendHalfButton" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="whole" data-copy="bendWholeButton" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="whole-release" data-copy="bendReleaseButton" disabled></button>
                  <button type="button" data-action="set-selected-bend" data-bend="clear" data-copy="bendClearButton" disabled></button>
                </div>
                <p id="score-status" class="muted" role="status" aria-live="polite" aria-atomic="true" data-entity="score-status"></p>
              </div>
            </div>
            <div id="score-scroll" class="score-scroll" role="region" tabindex="0" aria-label="Score">
              <svg id="score"></svg>
            </div>
            <div id="score-fallback" class="score-fallback" hidden></div>
          </section>

          <section id="guitar-section" class="workspace-pane" data-view-region="guitar" aria-labelledby="guitar-heading">
            <div class="pane-heading">
              <div>
                <h2 id="guitar-heading" data-copy="guitarHeading"></h2>
                <p data-copy="guitarHelp"></p>
              </div>
              <p id="guitar-playhead" class="guitar-playhead" role="status" aria-live="off" data-entity="guitar-playhead"></p>
              <p id="guitar-status" class="muted" role="status" aria-live="polite" aria-atomic="true" data-entity="guitar-status"></p>
            </div>
            <div id="guitar-scroll" class="guitar-scroll" role="region" tabindex="0" data-aria-copy="guitarRegionLabel">
              <svg id="guitar" role="img"></svg>
            </div>
            <p id="guitar-legend" class="muted" data-entity="guitar-positions"></p>
          </section>

          <section id="lyrics-section" class="workspace-pane" data-view-region="lyrics" aria-labelledby="lyrics-heading">
            <div class="pane-heading">
              <h2 id="lyrics-heading" data-copy="lyricsHeading"></h2>
              <p id="syllable-summary" class="muted" data-entity="lyric-mapping"></p>
            </div>
            <form id="lyrics-form" class="panel lyrics-form" data-action="set-lyrics">
              <label><span data-copy="rawLyricsLabel"></span><textarea id="raw-lyrics" name="rawText" rows="4" data-focus-key="lyrics"></textarea></label>
              <button type="submit" data-copy="saveLyricsButton"></button>
            </form>
            <form id="add-syllable-form" class="panel syllable-add-form" data-action="add-syllable">
              <label><span data-copy="newSyllableLabel"></span><input name="text" type="text" data-focus-key="new-syllable"></label>
              <button type="submit" data-copy="addSyllableButton"></button>
            </form>
            <ol id="syllable-list" class="syllable-list" data-entity="lyric-syllable-list"></ol>
          </section>
        </div>

        <aside class="workspace-sidebar" aria-label="Editor tools">
          <section id="generation-panel" class="inspector-card" aria-labelledby="generation-heading" hidden>
            <div class="inspector-heading">
              <h2 id="generation-heading" data-copy="generationHeading"></h2>
              <p data-copy="generationHelp"></p>
            </div>
            <form id="generation-form" class="generation-form" data-action="generate-gap" data-gap-ready="false">
              <p id="generation-gap-status" class="muted" role="status" aria-live="polite" aria-atomic="true" data-entity="generation-gap-hint"></p>
              <div id="generation-anchor-actions" class="generation-anchor-actions" role="group">
                <button type="button" class="secondary" data-action="mark-selected-anchors" data-copy="generationMarkAnchors" data-focus-key="generation-mark-anchors"></button>
                <button type="button" class="secondary" data-action="use-selected-anchors" data-copy="generationUseAnchors" data-focus-key="generation-use-anchors"></button>
              </div>
              <input id="generation-left-anchor" type="hidden" name="leftAnchorNoteId">
              <input id="generation-right-anchor" type="hidden" name="rightAnchorNoteId">
              <details class="generation-options">
                <summary data-copy="generationAdvanced"></summary>
                <div class="generation-advanced-popover">
                  <div class="form-grid generation-fields">
                    <label><span data-copy="generationStartLabel"></span><input id="generation-start" name="startTick" type="number" min="0" step="1" value="480" required data-focus-key="generation-start"></label>
                    <label><span data-copy="generationEndLabel"></span><input id="generation-end" name="endTick" type="number" min="0" step="1" value="1440" required data-focus-key="generation-end"></label>
                    <label><span data-copy="generationSeedLabel"></span><input id="generation-seed" name="seed" type="number" min="0" max="4294967295" step="1" value="1" required data-focus-key="generation-seed"></label>
                    <label><span data-copy="generationStyleLabel"></span><select id="generation-style" name="styleProfile" data-focus-key="generation-style"><option value="balanced" data-copy="styleBalanced"></option><option value="smooth" data-copy="styleSmooth"></option><option value="leaping" data-copy="styleLeaping"></option><option value="repetitive" data-copy="styleRepetitive"></option></select></label>
                    <label><span data-copy="generationMinPitchLabel"></span><select id="generation-min-pitch" name="minPitch" data-focus-key="generation-min-pitch"></select></label>
                    <label><span data-copy="generationMaxPitchLabel"></span><select id="generation-max-pitch" name="maxPitch" data-focus-key="generation-max-pitch"></select></label>
                    <label><span data-copy="generationLyricCountLabel"></span><input id="generation-lyric-count" name="lyricSyllableCount" type="number" min="0" max="32" step="1" data-focus-key="generation-lyric-count"></label>
                  </div>
                  <div class="generation-form-actions">
                    <button type="button" class="secondary" data-action="use-selection" data-copy="generationUseSelection" data-focus-key="generation-use-selection"></button>
                    <button type="button" class="secondary" data-action="use-generation-ticks" data-copy="generationUseTicks" data-focus-key="generation-use-ticks"></button>
                  </div>
                </div>
              </details>
              <div class="generation-form-actions generation-primary-actions">
                <button id="generate-gap" type="submit" data-copy="generationGenerate" data-focus-key="generation-generate" disabled></button>
              </div>
            </form>
            <div id="generation-session-actions" class="generation-session-actions" role="group">
              <button id="regenerate-gap" type="button" class="secondary" data-action="regenerate-gap" data-copy="generationRegenerate" data-focus-key="generation-regenerate" aria-keyshortcuts="R" disabled></button>
              <button id="clear-generation" type="button" class="secondary" data-action="clear-generation" data-copy="generationClear" disabled></button>
              <button id="lock-accepted-notes" type="button" class="secondary" data-action="lock-accepted-notes" data-focus-key="lock-accepted-notes" data-focus-fallback="generation-use-anchors" data-copy="generationLockAccepted" hidden></button>
            </div>
            <p id="generation-lock-help" class="muted" data-copy="generationLockHelp" hidden></p>
            <p id="generation-status" class="muted" role="status" aria-live="polite" aria-atomic="true" data-entity="generation-status"></p>
            <details class="shortcut-help">
              <summary data-copy="generationShortcutsHeading"></summary>
              <p class="muted" data-copy="generationShortcuts"></p>
            </details>
          </section>

          <section class="inspector-card note-inspector" aria-labelledby="notes-heading">
            <div class="inspector-heading">
              <h2 id="notes-heading" data-copy="notesHeading"></h2>
              <p data-copy="notesHelp"></p>
            </div>
            <ol id="note-list" class="note-list" data-entity="note-list"></ol>

          </section>

          <section class="inspector-card utility-card">
            <details class="sidebar-tools">
              <summary data-copy="toolsHeading"></summary>
              <div class="sidebar-tools-body">
                <details class="utility-details">
                  <summary data-copy="addNoteHeading"></summary>
                  <form id="add-note-form" class="panel compact-panel" data-action="add-note">
                    <div class="form-grid">
                      <label><span data-copy="pitchLabel"></span><input name="pitch" type="text" value="C4" pattern="[A-Ga-g][#b]?-?[0-9]+" required data-focus-key="add-pitch"></label>
                      <label><span data-copy="startTickLabel"></span><input id="add-start-tick" name="startTick" type="number" min="0" step="1" required data-focus-key="add-start"></label>
                      <label><span data-copy="durationLabel"></span><input name="durationTicks" type="number" min="1" step="1" value="480" required data-focus-key="add-duration"></label>
                    </div>
                    <button type="submit" data-focus-key="add-button" data-copy="addNoteButton"></button>
                  </form>
                </details>
                <details class="utility-details">
                  <summary id="selection-heading" data-copy="selectionHeading"></summary>
                  <form id="selection-form" class="panel compact-panel" data-action="select-range">
                    <div class="form-grid">
                      <label><span data-copy="rangeStartLabel"></span><input name="startTick" type="number" min="0" step="1" value="0" required data-focus-key="range-start"></label>
                      <label><span data-copy="rangeEndLabel"></span><input name="endTick" type="number" min="0" step="1" value="1920" required data-focus-key="range-end"></label>
                    </div>
                    <button type="submit" data-copy="selectRangeButton"></button>
                  </form>
                  <p id="selection-summary" class="muted" data-entity="selection"></p>
                </details>
              </div>
            </details>
          </section>
        </aside>
      </div>

      <section id="candidate-dock" class="candidate-dock" hidden aria-labelledby="candidate-dock-heading">
        <div class="candidate-dock-header">
          <div>
            <h2 id="candidate-dock-heading" data-copy="candidateDockHeading"></h2>
            <p id="candidate-dock-status" class="muted" data-copy="candidateDockHelp"></p>
          </div>
          <button type="button" class="secondary candidate-dock-close" data-action="clear-generation" data-copy="generationClear"></button>
        </div>
        <ol id="generation-candidates" class="generation-candidates" data-entity="melody-candidate-list"></ol>
      </section>

      <div id="note-context-menu" class="note-context-menu" role="menu" hidden aria-label="Note actions">
        <div class="note-context-selection" data-context-group="selection">
          <button type="button" role="menuitem" data-action="context-duplicate" data-copy="contextDuplicate"></button>
          <button type="button" role="menuitem" data-action="context-copy" data-copy="contextCopy"></button>
          <button type="button" role="menuitem" data-action="context-delete" data-copy="contextDelete"></button>
          <div class="context-separator" role="separator"></div>
          <button id="context-anchor" type="button" role="menuitemcheckbox" data-action="context-toggle-anchor"></button>
          <button id="context-lock" type="button" role="menuitemcheckbox" data-action="context-toggle-lock"></button>
          <div class="context-separator" role="separator"></div>
          <div class="context-group-label" data-copy="contextTranspose"></div>
          <div class="context-inline-actions">
            <button type="button" data-action="context-transpose" data-delta="-12">−12</button>
            <button type="button" data-action="context-transpose" data-delta="-1">−1</button>
            <button type="button" data-action="context-transpose" data-delta="1">+1</button>
            <button type="button" data-action="context-transpose" data-delta="12">+12</button>
          </div>
          <div class="context-group-label" data-copy="contextLength"></div>
          <div class="context-inline-actions">
            <button type="button" data-action="context-duration" data-snap="1/8">1/8</button>
            <button type="button" data-action="context-duration" data-snap="1/4">1/4</button>
            <button type="button" data-action="context-duration" data-snap="1/2">1/2</button>
          </div>
          <div class="context-group-label" data-copy="bendGroupLabel"></div>
          <div class="context-inline-actions bend-context-actions">
            <button type="button" data-action="set-selected-bend" data-bend="half" data-copy="bendHalfButton"></button>
            <button type="button" data-action="set-selected-bend" data-bend="whole" data-copy="bendWholeButton"></button>
            <button type="button" data-action="set-selected-bend" data-bend="whole-release" data-copy="bendReleaseButton"></button>
            <button type="button" data-action="set-selected-bend" data-bend="clear" data-copy="bendClearButton"></button>
          </div>
        </div>
        <div class="note-context-empty" data-context-group="empty" hidden>
          <button type="button" role="menuitem" data-action="context-add-note" data-copy="contextAddNote"></button>
          <button type="button" role="menuitem" data-action="context-paste-here" data-copy="contextPasteHere"></button>
          <button type="button" role="menuitem" data-action="context-select-all" data-copy="contextSelectAll"></button>
        </div>
      </div>

      <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
        <form method="dialog" class="confirm-dialog-card">
          <div class="confirm-dialog-copy">
            <h2 id="confirm-dialog-title" data-copy="newIdeaDialogTitle"></h2>
            <p id="confirm-dialog-message" data-copy="confirmNewIdea"></p>
          </div>
          <div class="confirm-dialog-actions">
            <button id="confirm-dialog-cancel" type="submit" value="cancel" class="secondary" data-copy="cancelButton" autofocus></button>
            <button id="confirm-dialog-confirm" type="submit" value="confirm" class="danger-button" data-copy="confirmNewIdeaButton"></button>
          </div>
        </form>
      </dialog>

      <dialog id="command-palette" class="command-palette" data-action="command-palette" aria-labelledby="command-palette-heading">
        <h2 id="command-palette-heading" class="visually-hidden" data-copy="paletteHeading"></h2>
        <div class="palette-search">
          <label class="visually-hidden" for="command-palette-input" data-copy="paletteSearchLabel"></label>
          <input id="command-palette-input" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="command-palette-list" aria-autocomplete="list" data-entity="palette-input" data-focus-key="palette-input">
        </div>
        <ol id="command-palette-list" class="palette-list" role="listbox" data-entity="palette-list"></ol>
        <p id="command-palette-empty" class="palette-empty" data-copy="paletteNoMatch" hidden></p>
        <p class="palette-hint muted" data-copy="paletteHint"></p>
      </dialog>

      <p id="operation-status" class="status" role="status" aria-live="polite" aria-atomic="true" data-entity="operation-status"></p>
    </main>
  </body>
</html>
